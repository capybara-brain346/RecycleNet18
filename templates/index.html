<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecycleNet18 Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading {
            opacity: 0.5;
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-100">
    <nav class="bg-green-600 text-white p-4">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">RecycleNet18 Dashboard</h1>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Model Management Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Model Management</h2>

                <div id="models-list" class="mb-6" hx-get="/api/v1/models" hx-trigger="load, modelUpdated from:body"
                    hx-indicator=".models-loading">
                    <div class="models-loading animate-pulse">Loading models...</div>
                </div>

                <div id="production-model" class="mb-6" hx-get="/api/v1/models/production"
                    hx-trigger="load, modelUpdated from:body">
                </div>
            </div>

            <!-- Inference Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Image Inference</h2>

                <form hx-post="/api/v1/predict" hx-encoding="multipart/form-data" hx-indicator="#inference-loading">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Upload Image</label>
                        <input type="file" name="image" accept="image/*" class="w-full p-2 border rounded">
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        Run Inference
                    </button>
                </form>

                <div id="inference-loading" class="htmx-indicator">
                    Processing...
                </div>

                <div id="inference-result" class="mt-4"></div>
            </div>

            <!-- Training Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Training</h2>

                <form hx-post="/api/v1/training/start" hx-indicator="#training-loading">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Dataset ID</label>
                        <select name="dataset_id" class="w-full p-2 border rounded" hx-get="/api/v1/datasets"
                            hx-trigger="load">
                        </select>
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        Start Training
                    </button>
                </form>

                <div id="training-loading" class="htmx-indicator">
                    Starting training job...
                </div>

                <div id="training-jobs" hx-get="/api/v1/training/jobs" hx-trigger="load, every 30s">
                </div>
            </div>

            <!-- Dataset Management Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Dataset Management</h2>

                <form hx-post="/api/v1/datasets/upload" hx-encoding="multipart/form-data"
                    hx-indicator="#dataset-loading">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Upload Dataset</label>
                        <input type="file" name="file" class="w-full p-2 border rounded">
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        Upload Dataset
                    </button>
                </form>

                <div id="dataset-loading" class="htmx-indicator">
                    Uploading dataset...
                </div>

                <div id="datasets-list" hx-get="/api/v1/datasets" hx-trigger="load, datasetUploaded from:body">
                </div>
            </div>

            <!-- AI Assistant Section -->
            <div class="bg-white p-6 rounded-lg shadow-md col-span-1 md:col-span-2">
                <h2 class="text-xl font-semibold mb-4">AI Assistant</h2>

                <form hx-post="/api/v1/assistant/query" hx-encoding="multipart/form-data"
                    hx-indicator="#assistant-loading">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Question</label>
                        <textarea name="question" class="w-full p-2 border rounded" rows="3"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Image (Optional)</label>
                        <input type="file" name="image" accept="image/*" class="w-full p-2 border rounded">
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        Ask Assistant
                    </button>
                </form>

                <div id="assistant-loading" class="htmx-indicator">
                    Thinking...
                </div>

                <div id="assistant-response" class="mt-4"></div>
            </div>
        </div>
    </main>
</body>

</html>
