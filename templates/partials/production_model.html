{% if model %}
<div class="bg-green-50 border border-green-200 p-4 rounded">
    <h3 class="font-semibold text-green-800">Current Production Model</h3>
    <p class="text-sm text-green-700">Model ID: {{ model.model_id }}</p>
    <p class="text-sm text-green-700">Deployed: {{ model.timestamp }}</p>
</div>
{% else %}
<div class="bg-yellow-50 border border-yellow-200 p-4 rounded">
    <p class="text-yellow-700">No production model currently deployed</p>
</div>
{% endif %}
