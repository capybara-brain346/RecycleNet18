<div class="space-y-4 mt-4">
    <h3 class="font-semibold">Training Jobs</h3>
    {% for job in jobs.Items %}
    <div
        class="border p-4 rounded {% if job.status == 'running' %}bg-blue-50{% elif job.status == 'completed' %}bg-green-50{% elif job.status == 'failed' %}bg-red-50{% endif %}">
        <div class="flex justify-between items-start">
            <div>
                <p class="font-medium">Job ID: {{ job.job_id }}</p>
                <p class="text-sm text-gray-600">Started: {{ job.start_time }}</p>
                <p class="text-sm text-gray-600">Dataset: {{ job.dataset_id }}</p>
                <p
                    class="text-sm font-medium {% if job.status == 'running' %}text-blue-600{% elif job.status == 'completed' %}text-green-600{% elif job.status == 'failed' %}text-red-600{% endif %}">
                    Status: {{ job.status }}
                </p>
            </div>
            {% if job.status == 'completed' %}
            <div hx-get="/training/jobs/{{ job.job_id }}/metrics" hx-trigger="load" class="text-sm">
                Loading metrics...
            </div>
            {% endif %}
        </div>
    </div>
    {% endfor %}
</div>
