<div class="bg-white border rounded p-4">
    <div class="space-y-2">
        <p class="font-medium">Question:</p>
        <p class="text-gray-700">{{ question }}</p>

        <p class="font-medium mt-4">Response:</p>
        <p class="text-gray-700 whitespace-pre-wrap">{{ response }}</p>

        {% if has_image %}
        <div class="mt-4">
            <p class="font-medium">Uploaded Image:</p>
            <img src="/static/uploads/{{ image_path }}" alt="Uploaded image" class="mt-2 max-w-full h-auto rounded">
        </div>
        {% endif %}
    </div>
</div>
