<div class="space-y-4 mt-4">
    <h3 class="font-semibold">Available Datasets</h3>
    {% for dataset in datasets %}
    <div class="border p-4 rounded">
        <h4 class="font-medium">{{ dataset.key }}</h4>
        <p class="text-sm text-gray-600">Size: {{ (dataset.size / 1024 / 1024) | round(2) }} MB</p>
        <p class="text-sm text-gray-600">Last Modified: {{ dataset.last_modified }}</p>
    </div>
    {% endfor %}
</div>
